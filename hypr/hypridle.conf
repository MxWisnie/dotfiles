# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # Lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # To avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 20         # Set monitor backlight to minimum.
    on-resume = brightnessctl -r                 # Restore monitor backlight.
}

listener {
    timeout = 350
    on-timeout = loginctl lock-session
}

# 3. Turn off the screen after 5.5 minutes
listener {
    timeout = 400
    on-timeout = hyprctl dispatch dpms off       # Turn off screen.
    on-resume = hyprctl dispatch dpms on         # Turn screen back on.
}

# 4. Suspend the laptop after 20 minutes
listener {
    timeout = 1200
    on-timeout = systemctl suspend               # Put laptop to sleep.
}
